name: Production smoke v3.3.7
on:
  push:
    branches: [validation/v3.3.7-production-smoke]
permissions:
  contents: read
jobs:
  production-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright/python:v1.57.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - name: Align browser home ownership
        run: chown "$(id -u):$(id -g)" /github/home
      - run: python3 -m pip install -r requirements-visual-qa.txt
      - name: Verify deployed APIs, pages and browser rendering
        run: python3 scripts/production_smoke_v337.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forgegov-v337-production-smoke
          path: artifacts/production-smoke
          retention-days: 30
