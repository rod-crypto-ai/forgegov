name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r backend/requirements.txt
      - run: python backend/manage.py test core platform_admin
      - run: python backend/manage.py makemigrations --check --dry-run
      - run: python scripts/private_beta_launch_audit.py
      - name: Ruff fatal-error gate
        run: ruff check backend --select E9,F63,F7,F82

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  responsive-release-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: pip install -r requirements-visual-qa.txt
      - run: python -m playwright install --with-deps chromium firefox webkit
      - name: Start production frontend
        run: |
          cp -R frontend/.next/static frontend/.next/standalone/.next/static
          cp -R frontend/public frontend/.next/standalone/public
          cd frontend && PORT=3100 HOSTNAME=127.0.0.1 node .next/standalone/server.js > /tmp/forgegov-next.log 2>&1 &
          for attempt in $(seq 1 60); do curl -fsS http://127.0.0.1:3100/intelligence/market >/dev/null && exit 0; sleep 1; done
          cat /tmp/forgegov-next.log
          exit 1
      - name: Cross-browser v3.2.4 market responsive QA
        run: FORGEGOV_QA_BASE_URL=http://127.0.0.1:3100 python scripts/visual_qa_market_intelligence.py
      - name: Cross-browser v3.2.5 capture operations responsive QA
        run: FORGEGOV_QA_BASE_URL=http://127.0.0.1:3100 python scripts/visual_qa_capture_operations.py
      - name: Cross-browser v3.2.6 ForgeAI platform responsive QA
        run: FORGEGOV_QA_BASE_URL=http://127.0.0.1:3100 python scripts/visual_qa_forgeai_platform.py
      - name: Cross-browser v3.3.0 billing responsive QA
        run: FORGEGOV_QA_BASE_URL=http://127.0.0.1:3100 python scripts/visual_qa_billing.py

  docker-release-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Configure isolated test environment
        run: |
          cp .env.example .env
          python3 - <<'PY'
          import secrets
          from pathlib import Path
          path = Path(".env")
          text = path.read_text().replace("replace-with-a-long-random-value", secrets.token_urlsafe(48))
          path.write_text(text)
          PY
          # Exercise the image filesystem instead of local-development bind mounts.
          cat > compose.release-ci.yml <<'YAML'
          services:
            backend:
              volumes: !reset []
            worker:
              volumes: !reset []
            beat:
              volumes: !reset []
          YAML
          echo "COMPOSE_FILE=docker-compose.yml:compose.release-ci.yml" >> "$GITHUB_ENV"
      - name: Build production containers
        run: |
          docker compose config --quiet
          docker compose build backend worker beat
          docker build --target runner --build-arg NEXT_PUBLIC_API_BASE_URL=http://127.0.0.1:8000/api -t forgegov-release-qa ./frontend
      - name: Start isolated services and verify migrations
        run: |
          docker compose up -d --wait backend worker beat
          docker compose exec -T backend python manage.py check
          docker compose exec -T backend python manage.py makemigrations --check --dry-run
          docker compose exec -T backend python manage.py test core.test_v330_commercial_readiness --verbosity 1
          ./scripts/release_smoke.sh
      - name: Verify database backup and isolated restore
        run: |
          ./scripts/backup_database.sh backups/v330-ci.dump
          ./scripts/verify_backup_restore.sh backups/v330-ci.dump
      - name: Verify non-root runtime and production frontend
        run: |
          for service in backend worker beat; do
            test "$(docker compose exec -T "$service" id -u)" != "0"
          done
          docker run -d --name forgegov-release-frontend -p 127.0.0.1:3100:3000 forgegov-release-qa
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3100/sign-in >/dev/null; then
              curl -fsS http://127.0.0.1:3100/brand/forgegov-logo.png >/dev/null
              exit 0
            fi
            sleep 1
          done
          exit 1
      - name: Collect failure diagnostics
        if: failure()
        run: |
          docker compose logs --tail=100
          docker logs forgegov-release-frontend || true
      - name: Clean up isolated services
        if: always()
        run: |
          docker rm -f forgegov-release-frontend || true
          docker compose down -v
