databases:
  - name: forgegov-db
    databaseName: forgegov
    user: forgegov
    plan: free

services:
  - type: redis
    name: forgegov-redis
    plan: free
    ipAllowList: []

  - type: web
    name: forgegov-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerCommand: gunicorn forgegov.wsgi:application --bind 0.0.0.0:$PORT --workers 3
    healthCheckPath: /api/health/
    envVars:
      - key: RUN_MIGRATIONS
        value: "true"
      - key: DATABASE_URL
        fromDatabase: { name: forgegov-db, property: connectionString }
      - key: REDIS_URL
        fromService: { type: redis, name: forgegov-redis, property: connectionString }
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_ALLOWED_HOSTS
        value: "forgegov-api.onrender.com"
      - key: FRONTEND_URL
        value: "https://forgegov.onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://forgegov.onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://forgegov.onrender.com"
      - key: PUBLIC_REGISTRATION_ENABLED
        value: "true"
      - key: SECURE_SSL_REDIRECT
        value: "true"
      - key: SECURE_HSTS_SECONDS
        value: "31536000"
      - key: SAM_GOV_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false

  - type: worker
    name: forgegov-worker
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerCommand: celery -A forgegov worker -l info
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: forgegov-db, property: connectionString }
      - key: REDIS_URL
        fromService: { type: redis, name: forgegov-redis, property: connectionString }
      - key: DJANGO_SECRET_KEY
        fromService: { type: web, name: forgegov-api, envVarKey: DJANGO_SECRET_KEY }

  - type: web
    name: forgegov
    runtime: docker
    rootDir: frontend
    dockerfilePath: ./Dockerfile
    dockerCommand: node server.js
    envVars:
      - key: NEXT_PUBLIC_API_BASE_URL
        value: "https://forgegov-api.onrender.com/api"
