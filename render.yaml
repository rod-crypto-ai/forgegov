databases:
- name: forgegov-db
  databaseName: forgegov
  user: forgegov
services:
- type: keyvalue
  name: forgegov-redis
  ipAllowList: []
  maxmemoryPolicy: noeviction
- type: pserv
  name: forgegov-searxng
  runtime: docker
  rootDir: searxng
  dockerfilePath: ./Dockerfile
  plan: starter
  envVars:
  - key: SEARXNG_SECRET
    generateValue: true
  - key: SEARXNG_LIMITER
    value: 'false'
  - key: SEARXNG_PUBLIC_INSTANCE
    value: 'false'
- type: web
  name: forgegov-api
  runtime: docker
  rootDir: backend
  dockerfilePath: ./Dockerfile
  healthCheckPath: /api/health/
  maxShutdownDelaySeconds: 60
  envVars:
  - key: SERVICE_ROLE
    value: web
  - key: RUN_MIGRATIONS
    value: 'true'
  - key: COLLECTSTATIC
    value: 'true'
  - key: MIGRATION_MAX_ATTEMPTS
    value: '12'
  - key: DATABASE_URL
    fromDatabase:
      name: forgegov-db
      property: connectionString
  - key: REDIS_URL
    fromService:
      type: keyvalue
      name: forgegov-redis
      property: connectionString
  - key: DJANGO_SECRET_KEY
    generateValue: true
  - key: DJANGO_DEBUG
    value: 'false'
  - key: API_PUBLIC_URL
    sync: false
  - key: DJANGO_ALLOWED_HOSTS
    sync: false
  - key: FRONTEND_URL
    sync: false
  - key: CORS_ALLOWED_ORIGINS
    sync: false
  - key: CSRF_TRUSTED_ORIGINS
    sync: false
  - key: PUBLIC_REGISTRATION_ENABLED
    value: 'true'
  - key: REGISTRATION_MODE
    value: public
  - key: EMAIL_BACKEND
    value: django.core.mail.backends.smtp.EmailBackend
  - key: EMAIL_HOST
    sync: false
  - key: EMAIL_PORT
    value: '587'
  - key: EMAIL_HOST_USER
    sync: false
  - key: EMAIL_HOST_PASSWORD
    sync: false
  - key: EMAIL_USE_TLS
    value: 'true'
  - key: DEFAULT_FROM_EMAIL
    value: 'ForgeGov <noreply@forge-gov.com>'
  - key: SECURE_SSL_REDIRECT
    value: 'true'
  - key: SECURE_HSTS_SECONDS
    value: '31536000'
  - key: SAM_GOV_API_KEY
    sync: false
  - key: OPENAI_API_KEY
    sync: false
  - key: ALERTS_ENABLED
    value: 'true'
  - key: NOTIFICATION_DIGESTS_ENABLED
    value: 'true'
  - key: DAILY_DIGEST_UTC_HOUR
    value: '13'
  - key: WEEKLY_DIGEST_DAY
    value: mon
  - key: WEEKLY_DIGEST_UTC_HOUR
    value: '13'
  - key: AI_PROVIDER
    value: openai
  - key: SEARXNG_HOSTPORT
    fromService:
      type: pserv
      name: forgegov-searxng
      property: hostport
  - key: AI_WEB_SEARCH_ENABLED
    value: 'true'
  - key: LIVE_WEB_CACHE_SECONDS
    value: '600'
  - key: SBA_SUBNET_FALLBACK_URL
    sync: false
  - key: MICROSOFT_CLIENT_ID
    sync: false
  - key: MICROSOFT_CLIENT_SECRET
    sync: false
  - key: MICROSOFT_TENANT_ID
    value: organizations
  - key: MICROSOFT_REDIRECT_URI
    sync: false
- type: worker
  name: forgegov-worker
  runtime: docker
  rootDir: backend
  dockerfilePath: ./Dockerfile
  maxShutdownDelaySeconds: 120
  envVars:
  - key: SERVICE_ROLE
    value: worker
  - key: RUN_MIGRATIONS
    value: 'false'
  - key: COLLECTSTATIC
    value: 'false'
  - key: DATABASE_URL
    fromDatabase:
      name: forgegov-db
      property: connectionString
  - key: REDIS_URL
    fromService:
      type: keyvalue
      name: forgegov-redis
      property: connectionString
  - key: DJANGO_SECRET_KEY
    fromService:
      type: web
      name: forgegov-api
      envVarKey: DJANGO_SECRET_KEY
  - key: DJANGO_DEBUG
    value: 'false'
  - key: CELERY_WORKER_CONCURRENCY
    value: '1'
  - key: SAM_GOV_API_KEY
    fromService:
      type: web
      name: forgegov-api
      envVarKey: SAM_GOV_API_KEY
  - key: OPENAI_API_KEY
    fromService:
      type: web
      name: forgegov-api
      envVarKey: OPENAI_API_KEY
  - key: SEARXNG_HOSTPORT
    fromService:
      type: pserv
      name: forgegov-searxng
      property: hostport
  - key: AI_WEB_SEARCH_ENABLED
    value: 'true'
  - key: LIVE_WEB_CACHE_SECONDS
    value: '600'
  - key: EMAIL_BACKEND
    fromService:
      type: web
      name: forgegov-api
      envVarKey: EMAIL_BACKEND
  - key: EMAIL_HOST
    fromService:
      type: web
      name: forgegov-api
      envVarKey: EMAIL_HOST
  - key: EMAIL_PORT
    fromService:
      type: web
      name: forgegov-api
      envVarKey: EMAIL_PORT
  - key: EMAIL_HOST_USER
    fromService:
      type: web
      name: forgegov-api
      envVarKey: EMAIL_HOST_USER
  - key: EMAIL_HOST_PASSWORD
    fromService:
      type: web
      name: forgegov-api
      envVarKey: EMAIL_HOST_PASSWORD
  - key: EMAIL_USE_TLS
    fromService:
      type: web
      name: forgegov-api
      envVarKey: EMAIL_USE_TLS
  - key: DEFAULT_FROM_EMAIL
    fromService:
      type: web
      name: forgegov-api
      envVarKey: DEFAULT_FROM_EMAIL
  - key: ALERTS_ENABLED
    value: 'true'
- type: worker
  name: forgegov-beat
  runtime: docker
  rootDir: backend
  dockerfilePath: ./Dockerfile
  maxShutdownDelaySeconds: 60
  envVars:
  - key: SERVICE_ROLE
    value: beat
  - key: RUN_MIGRATIONS
    value: 'false'
  - key: COLLECTSTATIC
    value: 'false'
  - key: DATABASE_URL
    fromDatabase:
      name: forgegov-db
      property: connectionString
  - key: REDIS_URL
    fromService:
      type: keyvalue
      name: forgegov-redis
      property: connectionString
  - key: DJANGO_SECRET_KEY
    fromService:
      type: web
      name: forgegov-api
      envVarKey: DJANGO_SECRET_KEY
  - key: DJANGO_DEBUG
    value: 'false'
  - key: SAM_GOV_API_KEY
    fromService:
      type: web
      name: forgegov-api
      envVarKey: SAM_GOV_API_KEY
  - key: ALERTS_ENABLED
    value: 'true'
  - key: NOTIFICATION_DIGESTS_ENABLED
    value: 'true'
  - key: DAILY_DIGEST_UTC_HOUR
    value: '13'
  - key: WEEKLY_DIGEST_DAY
    value: mon
  - key: WEEKLY_DIGEST_UTC_HOUR
    value: '13'
- type: web
  name: forgegov
  runtime: docker
  rootDir: frontend
  dockerfilePath: ./Dockerfile
  dockerCommand: node server.js
  envVars:
  - key: NEXT_PUBLIC_API_BASE_URL
    sync: false
